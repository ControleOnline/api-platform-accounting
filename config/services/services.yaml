services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    _instanceof:
        ControleOnline\Service\Imports\ImportProcessorInterface:
            tags: ['app.import_processor']

    ControleOnline\:
        resource: '../../src/*'
        exclude: '../../src/{Command,DependencyInjection,Entity,Resource,Migrations,Library,Message,Tests,Kernel.php}'
    ControleOnline\Repository\:
        resource: '../../src/Repository'
        tags: ['doctrine.repository_service']
    ControleOnline\Controller\:
        resource: '../../src/Controller'
        tags: ['controller.service_arguments']
    ControleOnline\Command\:
        resource: '../../src/Command'
        tags: ['console.command']
    ControleOnline\Filter\:
        resource: '../../src/Filter'
